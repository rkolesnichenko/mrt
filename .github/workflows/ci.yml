name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The 1.23.x job must not silently fetch a newer toolchain.
  GOTOOLCHAIN: local

jobs:
  check:
    name: check (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"] # the go.mod floor and the latest release
    steps:
      # Actions are pinned by commit, which a moved tag cannot change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          # The module has no go.sum (no dependencies); key on go.mod.
          cache-dependency-path: "**/go.mod"
      - name: Install staticcheck and govulncheck
        if: matrix.go == 'stable'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2   # 2026.2.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # The differential oracles (bgpdump, bgpkit-parser, bgpkit-bmp), so
      # TestMatchesBgpdump, TestMatchesBgpkitLive and TestBMPMatchesBgpkitLive
      # run instead of skipping. The build is cached under a key that changes
      # whenever build-oracles.sh (which pins them) or the bgpkit-bmp harness
      # changes; the script itself skips what is already installed.
      - name: Cache the oracles
        id: oracles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/bgpdump
            ~/.local/bin/.bgpdump.stamp
            ~/.local/bin/bgpkit-parser
            ~/.local/bin/bgpkit-bmp
            ~/.local/bin/.bgpkit-bmp.stamp
          key: oracles-${{ runner.os }}-${{ hashFiles('scripts/build-oracles.sh', 'internal/oracle/bgpkit-bmp/Cargo.*', 'internal/oracle/bgpkit-bmp/src/**') }}
      - name: Install the oracles' build dependencies
        if: steps.oracles.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake zlib1g-dev libbz2-dev
      - name: scripts/build-oracles.sh
        run: |
          scripts/build-oracles.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: scripts/check.sh
        run: scripts/check.sh
        env:
          # A missing oracle fails TestMatchesBgpdump, TestMatchesBgpkitLive
          # and TestBMPMatchesBgpkitLive here instead of skipping them.
          MRT_ORACLES_REQUIRED: "1"

  # The release ships darwin and windows binaries, and the code converts
  # uint32 lengths to int: the tests also run on macOS, Windows and 32-bit x86.
  # The oracles are not installed here, so the *Live tests skip.
  portability:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest, goarch: "" }
          - { name: windows, os: windows-latest, goarch: "" }
          - { name: linux 386, os: ubuntu-latest, goarch: "386" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: "**/go.mod"
      - name: go test ./...
        shell: bash
        run: go test -count=1 ./...
        env:
          GOARCH: ${{ matrix.goarch }}

  # internal/compare is its own module (it requires gobgp), outside ./... above.
  compare:
    name: build internal/compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: internal/compare/go.sum
      - name: go vet and go test in internal/compare
        working-directory: internal/compare
        run: go vet ./... && go test -count=1 ./...

  # Every fuzz target for 30s, beside the check jobs rather than after them.
  fuzz:
    name: fuzz (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          # fuzz.sh in the key gives this job a cache of its own: fuzz-
          # instrumented builds are of no use to the race and coverage builds.
          cache-dependency-path: |
            **/go.mod
            scripts/fuzz.sh
      - name: scripts/fuzz.sh
        run: scripts/fuzz.sh
        env:
          FUZZTIME: 30s
          FUZZ_SHARD: ${{ matrix.shard }}/2
      # go test writes a failing input under testdata/fuzz and does not print
      # it; without this the crash cannot be reproduced.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.shard }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # The one context branch protection requires: it fails unless every job
  # above succeeded. always() runs it when a needed job failed, which a plain
  # needs: would skip (a skipped required check counts as passed).
  ci-ok:
    name: ci ok
    needs: [check, portability, compare, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check and fuzz job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
